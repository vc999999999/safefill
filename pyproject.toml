[tool.ruff]
target-version = "py311"
# 存量代码长行普遍 100+（最长 315），取 120 符合现状；未启用 E501，此值仅供后续 formatter 使用。
line-length = 120
# safefill/ 是嵌套的独立 git 仓库，不属于本仓库扫描范围。
extend-exclude = ["safefill"]

[tool.ruff.lint]
# 务实基线：E4/E7/E9 语法级错误 + F pyflakes。不开 I（存量导入顺序乱，含刻意靠后的 sys.path 引导导入）。
select = ["E4", "E7", "E9", "F"]
ignore = [
    # 存量代码 64 处分号多语句，风格问题，不值得批量改写。
    "E702",
    # 存量代码 lambda 赋值，风格问题。
    "E731",
]

[tool.mypy]
python_version = "3.11"
# 扁平 scripts/ 布局：模块间用 `import secure_io` 这类同目录导入，mypy_path 提供解析路径。
# CI 中按目录分别调用 mypy 并加 --no-incremental，避免两份同名副本（collect/fill 的 collection.py 等）缓存串扰。
mypy_path = ["skills/safefill-collect/scripts", "skills/safefill-fill/scripts"]
ignore_missing_imports = true
follow_imports = "silent"
exclude = "(^safefill/|__pycache__)"

[[tool.mypy.overrides]]
# openvino_runtime 运行时动态拿 infer_engine.OpenVINOInferSession 作基类，mypy 无法把变量当类型，属设计使然。
module = ["openvino_runtime"]
disable_error_code = ["valid-type", "misc"]

[[tool.mypy.overrides]]
# collector 的告警来自 ingest/collect 的异构 summary dict 被推断为 object（operator/attr-defined 等）。
module = ["collector"]
disable_error_code = ["arg-type", "operator", "attr-defined", "union-attr"]

[[tool.mypy.overrides]]
# fill 的告警来自 {"format": ..., "entries": {...}} 字面量被推断成 dict[str, Collection[str]] 的联合类型噪声。
module = ["fill"]
disable_error_code = ["dict-item", "union-attr"]

[tool.bandit]
# 逐条评估后的跳过（均为中低危，理由如下）：
# B108 hardcoded_tmp_directory: secure_io.py 中 ('/tmp','/var','/etc') 是 macOS 别名安全校验字面量，并非临时目录使用，误报。
# B110 try_except_pass: ocr_engine.py 图像预处理失败时回退原图，是刻意的容错路径（Low）。
# B608 hardcoded_sql_expressions: collector.py review_task 的 f-string SQL 只含两个硬编码状态常量，无用户输入，误报。
# B615 huggingface_unsafe_download: vlm_extract.py 在提供 revision 时会显式传入，且下载后有 verify_model 清单校验兜底。
skips = ["B108", "B110", "B608", "B615"]

[tool.pytest.ini_options]
testpaths = ["tests"]
