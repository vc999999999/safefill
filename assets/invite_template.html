<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; img-src 'self' data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>隐填 · 私密信息收集</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.wrap{max-width:760px;margin:32px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:24px;box-shadow:0 8px 30px #17203312}h1{margin:0 0 8px;font-size:24px}.muted{color:#667085}.notice{background:#f0f6ff;border-left:4px solid #2563eb;padding:12px 16px;margin:20px 0;white-space:pre-wrap}.verify{background:#f7faf8;border:1px solid #d3e7db;border-left:4px solid #3f8f5f;border-radius:8px;padding:12px 16px;margin:0 0 20px;font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-all}.field{margin:18px 0}.field label{display:block;font-weight:600;margin-bottom:7px}.field input,.field textarea,.field select{box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #cfd6e4;border-radius:8px;font:inherit}.field textarea{min-height:90px}.hint{font-size:13px;color:#667085;margin-top:5px}.error{color:#b42318}.preview{background:#fafafa;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin:18px 0}.preview ul{margin:8px 0;padding-left:22px}.consent{display:flex;gap:10px;align-items:flex-start;margin:18px 0}.consent input{margin-top:4px}button{border:0;border-radius:9px;padding:11px 18px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:14px;white-space:pre-wrap}.footer{margin-top:18px;font-size:12px;color:#667085}</style>
</head>
<body><main class="wrap"><section class="card">
<h1 id="title"></h1>
<div class="muted" id="person"></div>
<div class="notice" id="notice"></div>
<div class="verify" id="verify"></div>
<form id="form" novalidate autocomplete="off"></form>
<div class="preview"><strong>提交前脱敏预览</strong><ul id="preview"><li>填写后将在这里显示遮罩结果。</li></ul></div>
<label class="consent"><input id="consent" type="checkbox"><span>我已阅读收集告知，确认填写内容和附件准确，并同意生成加密提交文件。</span></label>
<button id="export" type="button">生成加密提交文件</button>
<div id="status" class="status" role="status"></div>
<div class="footer">全部字段与附件只在当前浏览器中处理；页面不会联网。请通过职能人员指定的私聊方式交回 .yintian 文件。</div>
</section></main>
<script id="cfg" type="application/json">__YINTIAN_CONFIG__</script>
<script>
'use strict';
const cfg=JSON.parse(document.getElementById('cfg').textContent);
const $=id=>document.getElementById(id);
const enc=new TextEncoder();
const MAX_FILE=5*1024*1024,MAX_TOTAL=15*1024*1024;
const textTypes=new Set(['text','phone_cn','cn_id','date','address','single_choice']);
const attachmentTypes=new Set(['image_attachment','pdf_attachment']);
const b64=bytes=>{let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(s)};
const fromPem=pem=>Uint8Array.from(atob(pem.replace(/-----(BEGIN|END) PUBLIC KEY-----|\s/g,'')),c=>c.charCodeAt(0));
const canonicalAad=()=>JSON.stringify([cfg.format_version,cfg.task_id,cfg.invite_id,cfg.schema_hash,cfg.key_id]);
const normalizePhone=v=>v.trim().replace(/[\s-]/g,'').replace(/^\+?86/,'');
function validDate(v){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);if(!m)return false;const date=new Date(Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3])));return date.getUTCFullYear()===Number(m[1])&&date.getUTCMonth()===Number(m[2])-1&&date.getUTCDate()===Number(m[3])}
function validCnId(raw){const v=raw.trim().toUpperCase();if(!/^\d{17}[\dX]$/.test(v))return false;const d=v.slice(6,14),year=Number(d.slice(0,4)),month=Number(d.slice(4,6)),day=Number(d.slice(6,8)),date=new Date(Date.UTC(year,month-1,day));if(date.getUTCFullYear()!==year||date.getUTCMonth()!==month-1||date.getUTCDate()!==day)return false;const w=[7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2],m='10X98765432';let sum=0;for(let i=0;i<17;i++)sum+=Number(v[i])*w[i];return m[sum%11]===v[17]}
function mask(field,value){if(!value)return '未填写';if(field.type==='phone_cn')return value.slice(0,3)+'****'+value.slice(-4);if(field.type==='cn_id')return value.slice(0,4)+'**********'+value.slice(-4);if(field.sensitive||field.type==='address')return value.slice(0,1)+'***';return value}
function fieldValue(field){const el=$('f_'+field.id);if(field.type==='phone_cn')return normalizePhone(el.value);return el.value.trim()}
function validateField(field){const el=$('f_'+field.id),errors=[];if(attachmentTypes.has(field.type)){const files=[...el.files];if(field.required&&!files.length)errors.push('必须选择附件');for(const f of files){if(f.size>MAX_FILE)errors.push(`${f.name} 超过 5MB`);const ok=field.type==='image_attachment'?['image/jpeg','image/png','image/webp'].includes(f.type):f.type==='application/pdf';if(!ok)errors.push(`${f.name} 文件类型不支持`)}return errors}const v=fieldValue(field);if(field.required&&!v)errors.push('必填');if(v&&field.type==='phone_cn'&&!/^1[3-9]\d{9}$/.test(v))errors.push('请输入有效的中国大陆手机号');if(v&&field.type==='cn_id'&&!validCnId(v))errors.push('身份证号格式、日期或校验码错误');if(v&&field.type==='date'&&!validDate(v))errors.push('日期无效');return errors}
function render(){document.title=cfg.title;$('title').textContent=cfg.title;$('person').textContent=`填写人：${cfg.name}　邀请编号：${cfg.invite_id}`;$('notice').textContent=`用途：${cfg.purpose}\n截止时间：${cfg.deadline}\n保存期限：${cfg.retention_until}\n联系人：${cfg.contact}\n更正方式：${cfg.correction}`;$('verify').textContent=`邀请真伪核对\n任务编号：${cfg.task_id}\n邀请编号：${cfg.invite_id}\n公钥指纹（key_id）：${cfg.key_id}\n填写前，请通过发放人指定的线下方式（如电话或当面）核对以上编号与指纹是否一致；若不一致，请勿填写本页。`;for(const field of cfg.fields){const box=document.createElement('div');box.className='field';const label=document.createElement('label');label.htmlFor='f_'+field.id;label.textContent=field.label+(field.required?' *':'');box.appendChild(label);let el;if(field.type==='address'){el=document.createElement('textarea')}else if(field.type==='single_choice'){el=document.createElement('select');const empty=document.createElement('option');empty.value='';empty.textContent='请选择';el.appendChild(empty);for(const value of field.options||[]){const o=document.createElement('option');o.value=value;o.textContent=value;el.appendChild(o)}}else{el=document.createElement('input');el.type=attachmentTypes.has(field.type)?'file':field.type==='date'?'date':'text';if(field.type==='image_attachment')el.accept='image/jpeg,image/png,image/webp';if(field.type==='pdf_attachment')el.accept='application/pdf';if(attachmentTypes.has(field.type))el.multiple=!!field.multiple}el.id='f_'+field.id;el.name=field.id;el.required=!!field.required;el.autocomplete='off';if(field.id==='name')el.value=cfg.name;el.addEventListener('input',updatePreview);el.addEventListener('change',updatePreview);box.appendChild(el);const hint=document.createElement('div');hint.className='hint';hint.id='e_'+field.id;box.appendChild(hint);$('form').appendChild(box)}updatePreview()}
function updatePreview(){const items=[];for(const field of cfg.fields){const el=$('f_'+field.id);const value=attachmentTypes.has(field.type)?[...el.files].map(f=>f.name).join('、'):mask(field,fieldValue(field));items.push(`<li>${escapeHtml(field.label)}：${escapeHtml(value||'未填写')}</li>`)}$('preview').innerHTML=items.join('')}
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function sha256Hex(bytes){const hash=new Uint8Array(await crypto.subtle.digest('SHA-256',bytes));return [...hash].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function collectPayload(){const values={},attachments={};let total=0,valid=true;for(const field of cfg.fields){const errors=validateField(field),hint=$('e_'+field.id);hint.textContent=errors.join('；');hint.className=errors.length?'hint error':'hint';if(errors.length)valid=false;if(textTypes.has(field.type))values[field.id]=fieldValue(field);else{attachments[field.id]=[];for(const file of $('f_'+field.id).files){total+=file.size;const bytes=new Uint8Array(await file.arrayBuffer());attachments[field.id].push({name:file.name,type:file.type,size:file.size,sha256:await sha256Hex(bytes),data_b64:b64(bytes)})}}}if(total>MAX_TOTAL){$('status').textContent='附件总大小超过 15MB。';valid=false}if(!$('consent').checked){$('status').textContent='请先确认收集告知和填写内容。';valid=false}if(!valid)throw new Error('请修正表单中的问题。');return{format_version:cfg.format_version,task_id:cfg.task_id,invite_id:cfg.invite_id,invite_token:cfg.invite_token,schema_hash:cfg.schema_hash,notice_hash:cfg.notice_hash,template_version:cfg.template_version,submitted_at:new Date().toISOString(),consent_confirmed:true,values,attachments}}
async function encryptAndDownload(){if(!crypto?.subtle)throw new Error('当前浏览器不支持 Web Crypto API。');const payload=await collectPayload(),aes=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']),rawKey=new Uint8Array(await crypto.subtle.exportKey('raw',aes)),iv=crypto.getRandomValues(new Uint8Array(12)),aad=enc.encode(canonicalAad()),ciphertext=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad,tagLength:128},aes,enc.encode(JSON.stringify(payload)))),publicKey=await crypto.subtle.importKey('spki',fromPem(cfg.public_key_pem),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']),wrapped=new Uint8Array(await crypto.subtle.encrypt({name:'RSA-OAEP'},publicKey,rawKey));const envelope={format_version:cfg.format_version,task_id:cfg.task_id,invite_id:cfg.invite_id,schema_hash:cfg.schema_hash,key_id:cfg.key_id,algorithms:{content:'AES-256-GCM',key_wrap:'RSA-OAEP-3072-SHA256'},encrypted_key_b64:b64(wrapped),iv_b64:b64(iv),ciphertext_b64:b64(ciphertext)};const blob=new Blob([JSON.stringify(envelope)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=cfg.invite_id+'.yintian';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('form').reset();$('consent').checked=false;updatePreview();$('status').textContent='加密文件已生成。当前表单已清空，请通过私聊交回该 .yintian 文件并关闭页面。'}
$('export').addEventListener('click',async()=>{const button=$('export');button.disabled=true;$('status').textContent='正在本地加密，请稍候…';try{await encryptAndDownload()}catch(e){$('status').textContent=e.message||String(e)}finally{button.disabled=false}});
render();
</script></body></html>
