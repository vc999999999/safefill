name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q skills
      - run: python -m pytest -q

  skill-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git diff --check
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for skill in (Path('skills/safefill-fill'), Path('skills/safefill-collect')):
              text = (skill / 'SKILL.md').read_text(encoding='utf-8')
              assert text.startswith('---\n') and re.search(r'^name: [a-z0-9-]+$', text, re.M)
              assert (skill / 'scripts').is_dir()
          PY
