name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r skills/safefill-collect/requirements-dev.txt
      - run: python -m pytest skills/safefill-collect/scripts -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - run: node skills/safefill-collect/tests/browser_contract.cjs
